<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — SKYGLOBEGROUP</title>
<link rel="icon" href="/skyglobe-logo-t.png">
<style>
:root{--navy:#0A2E65;--ink:#0b1220;--muted:#5b6472;--line:#ececf1;--blue:#0a5bd6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1000px;margin:0 auto;height:62px;display:flex;align-items:center;gap:16px;padding:0 22px}
.nav .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:.98rem;flex-shrink:0}
.nav .brand img{width:28px;height:28px;object-fit:contain}
.nav form{flex:1;display:flex;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:5px 5px 5px 14px;align-items:center;max-width:640px}
.nav input{flex:1;border:none;outline:none;font-size:.98rem;font-family:inherit;color:var(--ink)}
.nav button{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-weight:600;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:30px 22px 80px}
.head{color:var(--muted);font-size:.95rem;margin-bottom:8px}
.head b{color:var(--ink)}
.group{margin-top:28px}
.group h2{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.res{display:block;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:10px;transition:.15s}
.res:hover{border-color:#c7d0e2;box-shadow:0 8px 22px rgba(10,46,101,.06)}
.res .t{font-weight:700;color:var(--ink)}.res .u{color:var(--blue);font-size:.8rem;margin-top:1px}.res .d{color:var(--muted);font-size:.9rem;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:13px;padding:14px;transition:.15s}
.card:hover{border-color:#c7d0e2;box-shadow:0 8px 22px rgba(10,46,101,.06)}
.card .cat{font-size:.66rem;font-weight:700;text-transform:uppercase;color:#8b5cf6;letter-spacing:.04em}
.card .t{font-weight:700;font-size:.94rem;margin-top:3px}.card .p{font-size:.9rem;margin-top:4px;color:var(--navy);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .ic{font-size:2.4rem}
</style>
</head>
<body>
<nav class="nav"><div class="in">
  <a class="brand" href="/"><img src="/skyglobe-logo-t.png" alt=""><span>SKYGLOBEGROUP</span></a>
  <form onsubmit="return go(event)"><input id="q" placeholder="Search the ecosystem…"><button type="submit">Search</button></form>
</div></nav>
<div class="wrap" id="out"><div class="empty"><div class="ic">🔎</div><p style="margin-top:8px">Type something to search across SKYGLOBEGROUP.</p></div></div>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qp(){var m=location.search.match(/[?&]q=([^&]*)/);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
function go(e){e.preventDefault();var q=document.getElementById('q').value.trim();location.href='/search?q='+encodeURIComponent(q);return false;}
function money(l){if(l.price==null)return 'Contact for price';var sym={USD:'$',EUR:'€',NGN:'₦',GHS:'GH₵',KES:'KSh',AED:'د.إ',ZAR:'R'}[l.currency]||'';return sym+Number(l.price).toLocaleString()+' '+l.currency;}
async function run(){
  var q=qp(); var out=document.getElementById('out'); if(!q)return; document.getElementById('q').value=q;
  out.innerHTML='<div class="empty"><div class="ic">⏳</div><p style="margin-top:8px">Searching…</p></div>';
  try{
    var d=await fetch('/api/search?q='+encodeURIComponent(q)).then(r=>r.json());
    var total=(d.pages||[]).length+(d.listings||[]).length+(d.courses||[]).length;
    if(!total){ out.innerHTML='<div class="empty"><div class="ic">🔎</div><p style="margin-top:8px;font-weight:700">No results for “'+esc(q)+'”</p><p>Try different words, or browse the marketplace and courses.</p></div>'; return; }
    var h='<div class="head">About <b>'+total+'</b> results for <b>“'+esc(q)+'”</b></div>';
    if(d.pages&&d.pages.length){ h+='<div class="group"><h2>Across the ecosystem</h2>'+d.pages.map(p=>`<a class="res" href="${esc(p.url)}"><div class="t">${esc(p.title)}</div><div class="u">${esc(p.url)}</div><div class="d">${esc(p.desc)}</div></a>`).join('')+'</div>'; }
    if(d.listings&&d.listings.length){ h+='<div class="group"><h2>Marketplace</h2><div class="cards">'+d.listings.map(l=>`<a class="card" href="/yunex/app"><div class="cat">${esc(l.pillar_icon||'')} ${esc(l.pillar_label||'')}</div><div class="t">${esc(l.title)}</div><div class="p">${esc(money(l))}</div></a>`).join('')+'</div></div>'; }
    if(d.courses&&d.courses.length){ h+='<div class="group"><h2>Academy courses</h2><div class="cards">'+d.courses.map(c=>`<a class="card" href="/academy"><div class="cat">${esc(c.school||'')}</div><div class="t">${esc(c.emoji||'')} ${esc(c.name)}</div></a>`).join('')+'</div></div>'; }
    out.innerHTML=h;
  }catch(_){ out.innerHTML='<div class="empty"><p>Search is unavailable right now — please try again.</p></div>'; }
}
run();
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
</script>
</body>
</html>
